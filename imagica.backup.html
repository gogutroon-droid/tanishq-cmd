<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>imagica — Tanishq Rana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=JetBrains+Mono&display=swap">
<style>
:root{--disp:"Cormorant Garamond",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0c;font-family:var(--sans)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;transition:background .7s}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.sq{position:absolute;overflow:hidden;cursor:pointer;border:0 solid rgba(0,0,0,.15)}
.arc{position:absolute;inset:0}
.in{position:absolute;inset:0}
.in>*{position:absolute}
.lg{left:9%;top:6%;font:600 3.2em var(--disp)}
.ct{left:2%;top:14%;writing-mode:vertical-rl;font:.7em var(--mono);letter-spacing:.2em}
.pp{left:42%;top:7%;width:50%;font-size:.85em;line-height:1.5}.pp.w{left:9%;top:24%;width:80%;font-size:1.5em}.vf{left:9%;top:22%;width:82%;aspect-ratio:16/9;background:#000 center/cover;outline:1px solid currentColor;display:grid;place-items:center;cursor:pointer;font-size:2.4em;color:#fff}
.tt{left:9%;bottom:6%;width:60%;font:700 2.8em/1.05 var(--sans)}
.tt small{display:block;font:400 .3em var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.8em}
.vw{right:9%;bottom:5%;width:12%;height:11%;display:grid;place-items:center;font:700 .85em var(--sans);cursor:pointer}
#flat{position:fixed;inset:0;display:none;place-items:center}
.reduced #flat{display:grid}.reduced #world{display:none}
#flat .sq{position:relative}
.hud{position:fixed;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;pointer-events:none;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;mix-blend-mode:difference}
.hud>*{pointer-events:auto}
#top{top:env(safe-area-inset-top,0)}#bot{bottom:env(safe-area-inset-bottom,0);flex-wrap:wrap}
button{font:inherit;color:inherit;background:none;border:1px solid currentColor;padding:7px 10px;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
button[aria-current=true]{background:#fff;color:#000}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#jump{display:flex;gap:4px;flex-wrap:wrap}#jump button{padding:5px 7px}
#hint{transition:opacity .6s}
#intro{position:fixed;inset:0;z-index:20;background:#f01c1c;transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity 1s;cursor:pointer}
#intro.out{transform:scale(3.2);opacity:0;pointer-events:none}
#intro svg{width:100%;height:100%}
#intro path{fill:none;stroke:#fff;stroke-linecap:square}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s cubic-bezier(.6,0,.3,1) forwards;animation-delay:var(--d)}
@keyframes dr{to{stroke-dashoffset:0}}
#mono{position:absolute;left:5%;top:11%;color:#fff;font:600 54px var(--disp);opacity:0;animation:fi 1s 1.6s forwards}
@keyframes fi{to{opacity:1}}
dialog{width:min(1100px,94vw);max-height:92vh;background:#0e0e10;color:#ecebe6;border:1px solid #333;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.88)}
.vh{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
#vt{font:600 30px var(--disp)}#vid{width:100%;max-height:70vh;background:#000;aspect-ratio:16/9}
#verr{color:#f6d044;font-size:13px}#vd{color:#9a9a94;font-size:13px;line-height:1.5}
</style></head><body>
<div id="stage"><div id="world"></div><div id="flat"></div></div>
<div class="hud" id="top"><strong id="nm"></strong><span id="ct" aria-hidden="true"></span></div>
<div class="hud" id="bot">
 <div><button id="pr" aria-label="Previous project">←</button> <button id="nx" aria-label="Next project">→</button> <button id="pl">Play</button> <button id="st">Start</button></div>
 <nav id="jump" aria-label="Jump to project"></nav><span id="hint">Scroll ↓ / ↑ ← →</span></div>
<div id="intro" aria-hidden="true"><div id="mono"></div></div>
<div id="live" aria-live="polite" style="position:absolute;left:-9999px"></div>
<dialog id="v" aria-label="Video viewer"><div class="vh"><div><div id="vt"></div><div id="vm" style="font:11px var(--mono);color:#9a9a94"></div></div><button id="vx">Close ✕</button></div>
<video id="vid" controls preload="none" playsinline></video><p id="verr" hidden></p><p id="vd"></p></dialog>
<script>
/* ============ CONFIG — edit freely. Files go in /videos and /thumbnails. Empty src/poster = marked placeholder ============ */
const SITE={company:'imagica',name:'Tanishq Rana',role:'VIDEO EDITOR / MOTION DESIGN / VISUAL STORYTELLING',
 showreel:{title:'Cut. Grade. Compose.',src:'videos/showreel.mp4',poster:'thumbnails/showreel.jpg',year:'2026',desc:'Placeholder showreel — replace with your own work.'},
 about:'Tanishq Rana — video editor and motion designer at imagica. Replace this with a few sentences about your approach to rhythm, story and sound.',
 skills:['Video editing','Cinematic storytelling','DaVinci Resolve','Fusion compositing','Motion graphics','Visual effects','Color grading','Sound sync','Short-form'],
 contact:{email:'hello@example.com',links:[['Instagram','https://instagram.com/'],['Vimeo','https://vimeo.com/'],['YouTube','https://youtube.com/']]}};
const CATS=['Cinematic edit','Short film','Music video','Motion graphics','Fusion / VFX','Color grading','Experimental','Travel film','Social edit'];
const PROJECTS=[
 {title:'Placeholder Cinematic Edit',category:CATS[0],year:'2026',desc:'Replace with a short description of this project and your role in it.',poster:'',src:'',credits:'',tools:'DaVinci Resolve'},
 {title:'Placeholder Music Video',category:CATS[2],year:'2025',desc:'Replace with your project description.',poster:'',src:'',credits:'',tools:'Resolve, Fusion'},
 {title:'Placeholder Fusion VFX',category:CATS[4],year:'2025',desc:'Replace with your project description.',poster:'',src:'',credits:'',tools:'Fusion'},
 {title:'Placeholder Color Grade',category:CATS[5],year:'2024',desc:'Replace with your project description.',poster:'',src:'',credits:'',tools:'Resolve Color'},
 {title:'Placeholder Travel Film',category:CATS[7],year:'2024',desc:'Replace with your project description.',poster:'',src:'',credits:'',tools:''}];
const ITEMS=[{kind:'reel',...SITE.showreel,category:'Showreel'},...PROJECTS.map(p=>({kind:'project',...p})),{kind:'about',title:'About'},{kind:'contact',title:'Hello.'}];
/* one theme per square: bg, quarter-disc tone, ink, pattern */
const TH=[{bg:'#f2f1ee',arc:'#e4e2dc',fg:'#e8202a',pat:'wave'},{bg:'#f6d044',arc:'#6d5c28',fg:'#16140a',pat:'wave'},{bg:'#5aaee0',arc:'#2e7fb0',fg:'#0b2d44',pat:'rings'},
 {bg:'#f01c1c',arc:'#a80d12',fg:'#fff',pat:'dots'},{bg:'#6a3df0',arc:'#4521b8',fg:'#f0eaff',pat:'grid'},{bg:'#1fb87a',arc:'#0c7a50',fg:'#04281b',pat:'diag'},
 {bg:'#ff7eb6',arc:'#d44a89',fg:'#3a0720',pat:'dots'},{bg:'#0d0d0f',arc:'#16161a',fg:'#fff',pat:'rings'}];
const N=ITEMS.length;

/* ============ GEOMETRY (no DOM) ============
   Golden rectangle R0=φ×1 (×1000); cut a square from left, top, right, bottom in turn. Each step is the same
   similarity S: scale 1/φ, rotate +90° (CSS clockwise) about a pole, so Q(i+1)=S(Q(i)).
   Camera at progress p = S^-p: rotate(-90p°) scale(φ^p) about the pole. At integer p the rectangle R_p sits exactly
   where R0 was, so the screen always shows: big square left, rotated next square top-right, smaller ones below.
   Pole: R4 = R0 scaled by φ^-4 → pole=(R4.x−k·R0.x)/(1−k).
   Arcs: quarter-circle in each square, centred on the corner adjacent to the previous arc's end and nearest the pole. */
const PHI=(1+Math.sqrt(5))/2;
function spiral(n){let r={x:0,y:0,w:PHI*1000,h:1000};const sq=[],R=[];
 for(let i=0;i<n+5;i++){R.push({...r});const s=Math.min(r.w,r.h),d=i%4;
  if(d==0){sq.push({x:r.x,y:r.y,s});r.x+=s;r.w-=s}
  else if(d==1){sq.push({x:r.x,y:r.y,s});r.y+=s;r.h-=s}
  else if(d==2){sq.push({x:r.x+r.w-s,y:r.y,s});r.w-=s}
  else{sq.push({x:r.x,y:r.y+r.h-s,s});r.h-=s}}
 const k=R[4].w/R[0].w,pole={x:(R[4].x-k*R[0].x)/(1-k),y:(R[4].y-k*R[0].y)/(1-k)},arcs=[];let prev=null;
 sq.slice(0,n).forEach((q,i)=>{const s=q.s,K=[[q.x,q.y],[q.x+s,q.y],[q.x,q.y+s],[q.x+s,q.y+s]],ad=(a,b)=>Math.abs(Math.hypot(a[0]-b[0],a[1]-b[1])-s)<.5&&(Math.abs(a[0]-b[0])<.5||Math.abs(a[1]-b[1])<.5);
  let c,st,en;if(i==0){c=K[3];st=K[2];en=K[1]}
  else{st=prev;c=K.filter(k=>ad(k,st)).sort((a,b)=>Math.hypot(a[0]-pole.x,a[1]-pole.y)-Math.hypot(b[0]-pole.x,b[1]-pole.y))[0]||K[3];en=K.find(k=>ad(k,c)&&(Math.abs(k[0]-st[0])>.5||Math.abs(k[1]-st[1])>.5))||K[1]}
  prev=en;arcs.push({c,st,en,right:c[0]>q.x+s/2,bottom:c[1]>q.y+s/2})});
 return{sq:sq.slice(0,n),pole,arcs}}
function camera(p,G,u,cx,cy,fx,fy){const o=G.pole;
 return `translate(${cx}px,${cy}px) scale(${u}) translate(${-fx}px,${-fy}px) translate(${o.x}px,${o.y}px) rotate(${-90*p}deg) scale(${PHI**p}) translate(${-o.x}px,${-o.y}px)`}

/* ============ CONTENT ============ */
const $=id=>document.getElementById(id);
const poster=(i)=>{const h=(i*47+20)%360;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90"><rect width="160" height="90" fill="hsl(${h},30%,14%)"/><text x="80" y="48" fill="#aaa" font-family="monospace" font-size="6" text-anchor="middle">PLACEHOLDER</text></svg>`)};
const pst=i=>ITEMS[i].poster||poster(i);
const ink=(t)=>t.fg=='#fff'||t.bg=='#0d0d0f'||t.bg=='#6a3df0'?'rgba(255,255,255,.22)':'rgba(0,0,0,.14)';
function pat(kind,c,k,at){const w=(a)=>a*k+'px';
 return {wave:`repeating-radial-gradient(circle at 30% 140%,${c} 0 ${w(1.2)},transparent ${w(1.2)} ${w(8)})`,
 dots:`radial-gradient(${c} ${w(1.4)},transparent ${w(1.9)}) 0 0/${w(14)} ${w(14)}`,
 grid:`linear-gradient(${c} ${w(1)},transparent ${w(1)}) 0 0/${w(24)} ${w(24)},linear-gradient(90deg,${c} ${w(1)},transparent ${w(1)}) 0 0/${w(24)} ${w(24)}`,
 diag:`repeating-linear-gradient(45deg,${c} 0 ${w(1.2)},transparent ${w(1.2)} ${w(10)})`,
 rings:`repeating-radial-gradient(circle at ${at},${c} 0 ${w(2)},transparent ${w(2)} ${w(13)})`}[kind]}
function mk(i,s,A,rot=0){const d=ITEMS[i],t=TH[i],e=document.createElement('div'),k=s/1000;e.className='sq';e.setAttribute('role','group');e.setAttribute('aria-label',d.title);
 const at=(A.right?'right':'left')+' '+(A.bottom?'bottom':'top');
 e.style.background=`${pat(t.pat,ink(t),k,at)},${t.bg}`;e.style.color=t.fg;e.style.borderWidth=s*.002+'px';
 const rad={'11':'100% 0 0 0','10':'0 100% 0 0','01':'0 0 0 100%','00':'0 0 100% 0'}[(A.right?1:0)+''+(A.bottom?1:0)];
 const n=String(i+1).padStart(2,'0'),link=(h,x)=>`<a href="${h}" target="_blank" rel="noopener" style="color:inherit">${x}</a>`;
 let body;
 if(d.kind=='about')body=`<div class="lg">${n}</div><div class="pp w"><p>${SITE.about}</p><p style="font:.8em var(--mono)">${SITE.skills.join(' · ')}</p></div><div class="tt"><small>Capabilities</small>About</div>`;
 else if(d.kind=='contact')body=`<div class="lg">${n}</div><div class="pp w"><p><a href="mailto:${SITE.contact.email}" style="color:inherit">${SITE.contact.email}</a></p><p>${SITE.contact.links.map(l=>link(l[1],l[0])).join(' &nbsp; ')}</p></div><div class="tt" style="font-size:7em"><small>Contact</small>Hello.</div>`;
 else body=`<div class="lg">${d.kind=='reel'?SITE.company:n}</div><div class="pp">${d.desc||''}${d.kind=='reel'?`<p style="font:.8em var(--mono)">${SITE.name} — ${SITE.role}</p>`:''}</div><div class="vf" role="button" aria-label="Open video: ${d.title}" style="background-image:url('${pst(i)}')">▶</div><div class="tt"><small>${d.category}${d.year?' · '+d.year:''}</small>${d.title}${d.tools?`<small style="margin:.8em 0 0">${d.tools}</small>`:''}</div><div class="vw" style="background:${t.fg};color:${t.bg}">▶ View</div>`;
 e.innerHTML=`<div class="arc" style="border-radius:${rad};background:${pat('rings',ink(t),k,at)},${t.arc}"></div><div class="in" style="font-size:${s*.02}px;transform:rotate(${rot}deg)"><div class="ct">${n} / ${String(N).padStart(2,'0')}</div>${body}</div>`;
 return e}

/* ============ STATE / ENGINE ============ */
const G=spiral(N),world=$('world'),flat=$('flat'),st=$('stage'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0,tgt=0,act=-1,raf=0,u=1,cx=0,cy=0,fx=809,fy=500,idle,drag=0,flatI=-1,introOn=!reduced;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sqs=G.sq.map((q,i)=>{const e=mk(i,q.s,G.arcs[i],i*90);e.dataset.i=i;e.style.cssText+=`left:${q.x}px;top:${q.y}px;width:${q.s}px;height:${q.s}px`;world.appendChild(e);return e});
function layout(){const W=innerWidth,H=innerHeight;cx=W/2;cy=H/2;
 if(W/H>=1.25){u=Math.min(W/1618,H/1000);fx=809;fy=500}else{u=Math.min(W*.98,H*.8)/1000;fx=500;fy=500}render()}
function render(){const a=Math.round(cur);
 if(reduced){document.body.classList.add('reduced');if(flatI!==a){flatI=a;const s=Math.min(innerWidth*.96,innerHeight*.9),e=mk(a,s,G.arcs[a]);e.style.width=e.style.height=s+'px';flat.replaceChildren(e)}}
 else world.style.transform=camera(cur,G,u,cx,cy,fx,fy);
 if(a!==act){act=a;hud()}}
function tick(){cur+=(tgt-cur)*.11;if(Math.abs(tgt-cur)<4e-4){cur=tgt;raf=0;render();history.replaceState(null,'','#'+act);return}render();raf=requestAnimationFrame(tick)}
function kick(){if(reduced){cur=tgt;render();history.replaceState(null,'','#'+act)}else if(!raf)raf=requestAnimationFrame(tick)}
function go(i){tgt=clamp(Math.round(i),0,N-1);$('hint').style.opacity=0;kick()}
const snap=()=>{clearTimeout(idle);idle=setTimeout(()=>go(tgt),140)};
addEventListener('wheel',e=>{if($('v').open)return;e.preventDefault();if(introOn)return endIntro();const dy=e.deltaMode?e.deltaY*16:e.deltaY;
 tgt=clamp(tgt+clamp(dy,-120,120)/600,0,N-1);$('hint').style.opacity=0;kick();snap()},{passive:false});
let py=null;
st.addEventListener('pointerdown',e=>{if(e.pointerType=='touch'){py=e.clientY;drag=0}});
st.addEventListener('pointermove',e=>{if(py==null)return;const d=e.clientY-py;py=e.clientY;drag+=Math.abs(d);tgt=clamp(tgt-d/(innerHeight*.6),0,N-1);kick()});
const end=()=>{if(py!=null){py=null;go(tgt)}};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
st.addEventListener('click',e=>{if(drag>8||e.target.closest('a'))return;const s=e.target.closest('.sq');if(!s)return;
 const i=reduced?act:+s.dataset.i;if(i!==act)go(i);else if(e.target.closest('.vw,.vf'))openV(i)});
addEventListener('keydown',e=>{if($('v').open||e.target.closest('video'))return;if(introOn){endIntro();return}const k=e.key,b=e.target.closest('button,a');
 if(k=='ArrowDown'||k=='ArrowRight'||k=='PageDown'||(k==' '&&!b))go(act+1);
 else if(k=='ArrowUp'||k=='ArrowLeft'||k=='PageUp')go(act-1);
 else if(k=='Home')go(0);else if(k=='End')go(N-1);else return;e.preventDefault()});
addEventListener('resize',layout);
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(!isNaN(n)&&n!==act)go(n)});

/* ============ HUD ============ */
$('nm').textContent=SITE.company;
ITEMS.forEach((d,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.setAttribute('aria-label','Go to '+d.title);b.onclick=()=>go(i);$('jump').appendChild(b)});
function hud(){const d=ITEMS[act];$('ct').textContent=`${String(act+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}`;
 [...$('jump').children].forEach((b,i)=>b.setAttribute('aria-current',i===act));
 $('pl').hidden=!/reel|project/.test(d.kind);$('live').textContent=d.title;st.style.background=TH[act].arc;
 sqs.forEach((e,i)=>e.querySelectorAll('a').forEach(a=>a.tabIndex=i===act?0:-1))}
$('pr').onclick=()=>go(act-1);$('nx').onclick=()=>go(act+1);$('st').onclick=()=>go(0);$('pl').onclick=()=>openV(act);

/* ============ VIEWER (video is never inside the rotating world) ============ */
const v=$('v'),vid=$('vid');
function openV(i){const d=ITEMS[i];$('vt').textContent=d.title;$('vm').textContent=[d.category,d.year,d.tools].filter(Boolean).join(' · ');
 $('vd').innerHTML=[d.desc,d.credits&&'Credits: '+d.credits,d.link&&`<a href="${d.link}" target="_blank" rel="noopener" style="color:#f6d044">Project link</a>`].filter(Boolean).join('<br>');
 const err=$('verr');err.hidden=true;vid.hidden=false;vid.poster=pst(i);
 vid.onerror=()=>{err.textContent='Video file not found or unsupported: '+d.src;err.hidden=false;vid.hidden=true};
 if(d.src){vid.preload='metadata';vid.src=d.src}else{vid.removeAttribute('src');err.textContent='Placeholder — no video yet. Set "src" for this entry in the config at the top of the file.';err.hidden=false;vid.hidden=true}
 v.showModal()}
$('vx').onclick=()=>v.close();v.addEventListener('click',e=>{if(e.target===v)v.close()});
v.addEventListener('close',()=>{vid.pause();vid.removeAttribute('src');vid.load()});

/* ============ OPENING ANIMATION: the golden spiral draws itself, then the screen zooms into the site ============ */
const intro=$('intro');
function endIntro(){if(!introOn)return;introOn=false;intro.classList.add('out');setTimeout(()=>intro.remove(),1200)}
if(introOn){
 const sw=(d,t,w)=>`<path class="dr" pathLength="1" style="--d:${t}s" stroke-width="${w}" d="${d}"/>`;let h='';
 G.sq.forEach((q,i)=>{const a=G.arcs[i],t=(i*.28).toFixed(2);
  h+=sw(`M${q.x} ${q.y}h${q.s}v${q.s}h${-q.s}z`,t,4)+sw(`M${a.st[0]} ${a.st[1]}A${q.s} ${q.s} 0 0 1 ${a.en[0]} ${a.en[1]}`,(+t+.2).toFixed(2),7)});
 intro.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 1618 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${h}</svg>`);
 $('mono').textContent=SITE.company;
 intro.onclick=endIntro;setTimeout(endIntro,3900)}
else intro.remove();

const h0=parseInt(location.hash.slice(1));if(!isNaN(h0))cur=tgt=clamp(h0,0,N-1);
layout();
</script></body></html>
