  const cx = 724;

  let paths = '';

  // Concentric radiating guilloché arcs in micro-fine black linework

    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="rgba(0,0,0,0.11)" stroke-width="0.7" />`;
  }

  // Cross-hatching subtle geometric arcs
  for (let r = 80; r <= 1200; r += 72) {
    paths += `<path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" stroke="rgba(0,0,0,0.06)" stroke-width="0.6" stroke-dasharray="4,8" />`;
  }

  return `
    <svg class="sec-abstract-pattern" viewBox="0 0 1000 1000" fill="none" preserveAspectRatio="none" aria-hidden="true">
      ${paths}
    </svg>
  `;
}

/**
 * ==============================================================================
 * MATHEMATICAL GOLDEN SPIRAL ENGINE (from narrowdesign.com production source)
 * ==============================================================================
 */
let winW = window.innerWidth;
let winH = window.innerHeight;
let smallScreen = winW < 960;
let landscape = winH < winW;

let spiralOriginX = 0;
let spiralOriginY = 0;
let sectionOriginX = 0;
let sectionOriginY = 0;
let baseSize = 0;

let rotation = 0;
let targetRotation = 0;
let currentSection = 0;
let isAnimating = false;
let animRAF = null;

const sections = document.querySelectorAll('.js-section');
const dots = document.querySelectorAll('.js-dot');
const jumpBtns = document.querySelectorAll('#jump button');
const currentNumEl = document.querySelector('.js-current');
const totalNumEl = document.querySelector('.js-total');
const ctEl = document.getElementById('ct');

totalNumEl.textContent = SECTION_COUNT;

let isGlobalMuted = true;

function syncAudioState() {
  const allVideos = document.querySelectorAll('.sec-inline-video');
  allVideos.forEach(v => {
    v.muted = isGlobalMuted;
  });

  const muteBtn = document.getElementById('mute-btn');
  if (muteBtn) {
    muteBtn.innerHTML = isGlobalMuted ? '🔇 Sound' : '🔊 Sound On';
    muteBtn.setAttribute('aria-pressed', isGlobalMuted ? 'false' : 'true');
    if (!isGlobalMuted) {
      muteBtn.classList.add('is-active');
    } else {
      muteBtn.classList.remove('is-active');
    }
  }

  const audioBtns = document.querySelectorAll('.js-audio-toggle');
  audioBtns.forEach(btn => {
    const icon = btn.querySelector('.sec-audio-icon');
    const text = btn.querySelector('.sec-audio-text');
    if (isGlobalMuted) {
      if (icon) icon.textContent = '🔇';
      if (text) text.textContent = 'Unmute';
      btn.classList.remove('is-unmuted');
      btn.setAttribute('aria-label', 'Unmute audio');
    } else {
      if (icon) icon.textContent = '🔊';
      if (text) text.textContent = 'Mute';
      btn.classList.add('is-unmuted');
      btn.setAttribute('aria-label', 'Mute audio');
    }
  });

  if (!isGlobalMuted) {
    const activeSec = sections[currentSection];
    if (activeSec) {
      const activeVid = activeSec.querySelector('.sec-inline-video');
      if (activeVid) {
        activeVid.muted = false;
        activeVid.play().catch(() => {});
      }
    }
  }
}

function toggleGlobalAudio() {
  isGlobalMuted = !isGlobalMuted;
  syncAudioState();
}

function buildSpiral() {
  winW = window.innerWidth;
  winH = window.innerHeight;
  smallScreen = winW < 960;
  landscape = winH < winW;

  if (smallScreen && !landscape) {
    spiralOriginX = Math.floor((winW / ASPECT) * ASPECT * (1 - AXIS));
    spiralOriginY = Math.floor((winW / ASPECT) * AXIS);
    sectionOriginX = spiralOriginX;
    sectionOriginY = spiralOriginY;
    baseSize = winW;
  } else {
    spiralOriginX = Math.floor(winW * AXIS);
    spiralOriginY = Math.floor(winW * ASPECT * AXIS);
    sectionOriginX = spiralOriginX;
    sectionOriginY = spiralOriginY;
    baseSize = Math.floor(winW * ASPECT);
  }

  world.style.top = '0px';
  world.style.left = '0px';
  world.style.transformOrigin = `${spiralOriginX}px ${spiralOriginY}px`;

  sections.forEach((sec, i) => {
    const myRot = Math.floor(90 * i);
    const myScale = Math.pow(ASPECT, i);
    sec.style.width = `${baseSize}px`;
    sec.style.height = `${baseSize}px`;
    sec.style.transformOrigin = `${sectionOriginX}px ${sectionOriginY}px`;
    sec.style.transform = `rotate(${myRot}deg) scale(${myScale})`;
  });

  updateTransform();
}

let lastActiveIdx = -1;

function updateActiveSection(activeIdx) {
  if (activeIdx === lastActiveIdx) return;
  lastActiveIdx = activeIdx;
  currentSection = activeIdx;

  const secData = SECTIONS_DATA[activeIdx];
  if (secData) {
    document.body.style.backgroundColor = secData.bg;
    document.body.style.color = secData.fg;
  }

  // Update counters
  const curStr = String(activeIdx + 1).padStart(2, '0');
  const totStr = String(SECTION_COUNT).padStart(2, '0');
  ctEl.textContent = `${curStr} / ${totStr}`;
  currentNumEl.textContent = activeIdx + 1;

  // Active classes, immediate in-view video autoplay & pause for inactive slides
  sections.forEach((sec, idx) => {
    const inlineVid = sec.querySelector('.sec-inline-video');
    if (idx - activeIdx < -1) {
      sec.style.display = 'none';
    } else {
      sec.style.display = 'block';
    }
    if (idx === activeIdx) {
      sec.classList.add('active');
      if (inlineVid) {
        inlineVid.muted = isGlobalMuted;
        inlineVid.play().catch(() => {});
      }
    } else {
      sec.classList.remove('active');
      if (inlineVid && !inlineVid.paused) {
        inlineVid.pause();
      }
    }
  });

  dots.forEach((dot, idx) => {
    if (idx === activeIdx) dot.classList.add('active');
    else dot.classList.remove('active');
  });

  jumpBtns.forEach((btn, idx) => {
    if (idx === activeIdx) btn.setAttribute('aria-current', 'true');
    else btn.removeAttribute('aria-current');
  });
}

function updateTransform() {
  const scale = Math.pow(ASPECT, rotation / 90);
  world.style.transform = `rotate(${rotation}deg) scale(${scale})`;

  const activeIdx = Math.min(SECTION_COUNT - 1, Math.max(0, Math.round(rotation / -90)));
  updateActiveSection(activeIdx);
}

/**
 * Dynamic Motion Blur & Smooth Easing Transition to Target Angle
 */
let isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function applyMotionBlur(instantDiff) {
  if (isReducedMotion) {
    world.style.filter = 'none';
    return;
  }
  const speed = Math.abs(instantDiff);
  const blur = Math.min(4.5, speed * 0.22);
  if (blur > 0.12) {
    world.style.filter = `blur(${blur.toFixed(1)}px)`;
  } else {
    world.style.filter = 'none';
  }
}

function animateToRotation(targetR, customDuration) {
  cancelAnimationFrame(animRAF);
  const startR = rotation;
  const deltaR = targetR - startR;
  if (Math.abs(deltaR) < 0.05) {
    rotation = targetR;
    applyMotionBlur(0);
    updateTransform();
    return;
  }
  const duration = customDuration || Math.min(360, 240 + Math.abs(deltaR) * 0.12);
  const startTime = performance.now();
  let lastR = startR;

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);
    const ease = 1 - Math.pow(1 - progress, 3);
    rotation = startR + deltaR * ease;
    const instantDiff = rotation - lastR;
    lastR = rotation;
    applyMotionBlur(instantDiff);
    updateTransform();

    if (progress < 1) {
      animRAF = requestAnimationFrame(step);
    } else {
      rotation = targetR;
      applyMotionBlur(0);
      updateTransform();
    }
  }
  animRAF = requestAnimationFrame(step);
}

function navigateTo(index) {
  currentSection = Math.max(0, Math.min(SECTION_COUNT - 1, index));
  targetRotation = currentSection * -90;
  animateToRotation(targetRotation);
}

function navigateDelta(direction) {
  navigateTo(currentSection + direction);
}

/**
 * ==============================================================================
 * WHEEL, TOUCH, GESTURE, AND KEYBOARD EVENT HANDLERS
 * Strict single-gesture latch prevents multi-skip glitches
 * ==============================================================================
 */
let isWheelLocked = false;
let wheelUnlockTimer = null;

window.addEventListener('wheel', (e) => {
  if (introOn) {
    endIntro();
    return;
  }
  if (document.body.classList.contains('is-modal-open')) return;
  e.preventDefault();

  // Trailing-edge silence reset: as long as wheel events stream in, keep locked
  clearTimeout(wheelUnlockTimer);
  wheelUnlockTimer = setTimeout(() => {
    isWheelLocked = false;
  }, 450);

  // If already locked within this gesture, prevent multi-skipping
  if (isWheelLocked) return;

  if (Math.abs(e.deltaY) > 15 || Math.abs(e.deltaX) > 15) {
    isWheelLocked = true;
    if (e.deltaY > 15 || e.deltaX > 15) {
      navigateDelta(1);
    } else {
      navigateDelta(-1);
    }
  }
}, { passive: false });

// Touch / Swipe Navigation
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  touchStartX = touch.pageX;
  touchStartY = touch.pageY;
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (document.body.classList.contains('is-modal-open')) return;
  const touch = e.changedTouches[0];
  const dx = touch.pageX - touchStartX;
  const dy = touch.pageY - touchStartY;

  if (Math.abs(dy) > 40 || Math.abs(dx) > 40) {
    if (dy < -40 || dx < -40) {
      navigateDelta(1);
    } else {
      navigateDelta(-1);
    }
  }
}, { passive: true });

// Keyboard Navigation
window.addEventListener('keydown', (e) => {
  if (introOn) {
    endIntro();
    return;
  }
  if (document.body.classList.contains('is-modal-open')) {
    if (e.key === 'Escape') closeVideoModal();
    return;
  }

  switch (e.key) {
    case 'ArrowDown':
    case 'ArrowRight':
    case ' ':
      e.preventDefault();
      navigateDelta(1);
      break;
    case 'ArrowUp':
    case 'ArrowLeft':
      e.preventDefault();
      navigateDelta(-1);
      break;
    case 'Home':
      e.preventDefault();
      navigateTo(0);
      break;
    case 'End':
      e.preventDefault();
      navigateTo(SECTION_COUNT - 1);
      break;
  }
});

// HUD Control Buttons
document.getElementById('nx').addEventListener('click', () => navigateDelta(1));
document.getElementById('pr').addEventListener('click', () => navigateDelta(-1));
document.getElementById('st').addEventListener('click', () => navigateTo(0));
document.getElementById('pl').addEventListener('click', () => openVideoModal(currentSection));
document.getElementById('mute-btn')?.addEventListener('click', toggleGlobalAudio);

/* ==============================================================================
   OPENING ANIMATION: The golden spiral draws itself in red (#f01c1c), then zooms out
   ============================================================================== */
const PHI_INTRO = (1 + Math.sqrt(5)) / 2;
function buildIntroSpiral(n) {
  let r = { x: 0, y: 0, w: PHI_INTRO * 1000, h: 1000 };
  const sq = [], R = [];
  for (let i = 0; i < n + 5; i++) {
    R.push({ ...r });
    const s = Math.min(r.w, r.h), d = i % 4;
    if (d === 0) { sq.push({ x: r.x, y: r.y, s }); r.x += s; r.w -= s; }
    else if (d === 1) { sq.push({ x: r.x, y: r.y, s }); r.y += s; r.h -= s; }
    else if (d === 2) { sq.push({ x: r.x + r.w - s, y: r.y, s }); r.w -= s; }
    else { sq.push({ x: r.x, y: r.y + r.h - s, s }); r.h -= s; }
  }
  const k = R[4].w / R[0].w;
  const pole = { x: (R[4].x - k * R[0].x) / (1 - k), y: (R[4].y - k * R[0].y) / (1 - k) };
  const arcs = [];
  let prev = null;
  sq.slice(0, n).forEach((q, i) => {
    const s = q.s;
    const K = [[q.x, q.y], [q.x + s, q.y], [q.x, q.y + s], [q.x + s, q.y + s]];
    const ad = (a, b) => Math.abs(Math.hypot(a[0] - b[0], a[1] - b[1]) - s) < 0.5 &&
      (Math.abs(a[0] - b[0]) < 0.5 || Math.abs(a[1] - b[1]) < 0.5);
    let c, st, en;
    if (i === 0) { c = K[3]; st = K[2]; en = K[1]; }
    else {
      st = prev;
      c = K.filter(k => ad(k, st)).sort((a, b) => Math.hypot(a[0] - pole.x, a[1] - pole.y) - Math.hypot(b[0] - pole.x, b[1] - pole.y))[0] || K[3];
      en = K.find(k => ad(k, c) && (Math.abs(k[0] - st[0]) > 0.5 || Math.abs(k[1] - st[1]) > 0.5)) || K[1];
    }
    prev = en;
    arcs.push({ c, st, en });
  });
  return { sq: sq.slice(0, n), pole, arcs };
}

const intro = document.getElementById('intro');
let introOn = !isReducedMotion;

function endIntro() {
  if (!introOn || !intro) return;
  introOn = false;
  intro.classList.add('out');
  intro.classList.add('dismissed');
  setTimeout(() => {
    if (intro && intro.parentNode) intro.remove();
  }, 1200);
}

if (introOn && intro) {
  const G_intro = buildIntroSpiral(8);
  const sw = (d, t, w) => `<path class="dr" pathLength="1" style="--d:${t}s" stroke-width="${w}" d="${d}"/>`;
  let h = '';
  G_intro.sq.forEach((q, i) => {
    const a = G_intro.arcs[i];
    const t = (i * 0.28).toFixed(2);
    h += sw(`M${q.x} ${q.y}h${q.s}v${q.s}h${-q.s}z`, t, 4) +
         sw(`M${a.st[0]} ${a.st[1]}A${q.s} ${q.s} 0 0 1 ${a.en[0]} ${a.en[1]}`, (+t + 0.2).toFixed(2), 7);
  });
  intro.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 1618 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${h}</svg>`);
  intro.addEventListener('click', endIntro);
  intro.addEventListener('wheel', endIntro, { passive: true });
  setTimeout(endIntro, 3900);
} else if (intro) {
  intro.remove();
}

// Window Resize
window.addEventListener('resize', buildSpiral);

/**
 * Interactive Eye Pupil Cursor Tracking (.js-eye-retina)
 */
window.addEventListener('mousemove', (e) => {
  const activeSec = document.querySelector('.js-section.active');
  if (!activeSec) return;
  const retina = activeSec.querySelector('.js-eye-retina');
  const pupil = activeSec.querySelector('.js-eye-pupil');
  const highlight = activeSec.querySelector('.js-eye-highlight');
  if (retina) {
    const rect = retina.getBoundingClientRect();
    const rx = rect.left + rect.width / 2;
    const ry = rect.top + rect.height / 2;
    const dx = Math.max(-5, Math.min(5, (e.clientX - rx) * 0.08));
    const dy = Math.max(-5, Math.min(5, (e.clientY - ry) * 0.08));
    retina.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
    if (pupil) pupil.style.transform = `translate3d(${dx * 1.25}px, ${dy * 1.25}px, 0)`;
    if (highlight) highlight.style.transform = `translate3d(${dx * 0.4}px, ${dy * 0.4}px, 0)`;
  }
});

// Clicking any section directly navigates to it
sections.forEach((sec, idx) => {
  sec.addEventListener('click', (e) => {
    if (e.target.closest('.js-play-trigger') || e.target.closest('.js-project-cta') || e.target.closest('a')) return;
    if (idx !== currentSection) {
      navigateTo(idx);
    }
  });
});

// Click handlers for CTA, video frame, and "Watch Film ↗" triggers
document.addEventListener('click', (e) => {
  const audioToggle = e.target.closest('.js-audio-toggle');
  if (audioToggle) {
    e.preventDefault();
    e.stopPropagation();
    toggleGlobalAudio();
    return;
  }

  const trigger = e.target.closest('.js-play-trigger') || e.target.closest('.js-project-cta') || e.target.closest('.js-play-flat');
  if (trigger) {
    e.preventDefault();
    e.stopPropagation();
    const idx = trigger.dataset.index !== undefined ? parseInt(trigger.dataset.index, 10) : currentSection;
    openVideoModal(idx);
  }
});

/**
 * ==============================================================================
 * CINEMA VIDEO SHOWCASE MODAL
 * ==============================================================================
 */
const dialog = document.getElementById('v');
const vid = document.getElementById('vid');
const vt = document.getElementById('vt');
const vm = document.getElementById('vm');
const vd = document.getElementById('vd');
const vspecs = document.getElementById('vspecs');
const vx = document.getElementById('vx');
const verr = document.getElementById('verr');

let previousFocusedEl = null;

function openVideoModal(index) {
  const sec = SECTIONS_DATA[index];
  if (!sec) return;

  // Pause active inline video while cinema modal is open
  const activeSec = sections[currentSection];
  if (activeSec) {
    const inlineVid = activeSec.querySelector('.sec-inline-video');
    if (inlineVid && !inlineVid.paused) {
      inlineVid.pause();
    }
  }

  previousFocusedEl = document.activeElement;
  document.body.classList.add('is-modal-open');

  vt.textContent = sec.modalTitle || sec.title;
  vm.textContent = `${sec.category || 'Cinematic Film'} · ${sec.year || '2026'} · ${sec.tools || 'DaVinci Resolve'}`;
  vd.innerHTML = sec.desc;
  vspecs.innerHTML = `
    <strong>Format &amp; Master</strong>
    Aspect Ratio: ${sec.aspect || '16:9 DCI 4K'}<br>
    Runtime: ${sec.duration || '00:30'}<br>
    Color Space: Rec.709 / ACEScct<br>
    Role: ${sec.role || 'Lead Editor &amp; Colorist'}
  `;

  verr.hidden = true;
  verr.textContent = '';

  vid.pause();
  vid.src = sec.video || 'videos/lyrics1st.mov';
  vid.poster = sec.poster || '';
  vid.currentTime = 0;
  vid.muted = false;
  vid.controls = true;

  dialog.showModal();

  const playPromise = vid.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  }
}

function closeVideoModal() {
  vid.pause();
  vid.src = '';
  dialog.close();
  document.body.classList.remove('is-modal-open');

  // Resume active inline video
  const activeSec = sections[currentSection];
  if (activeSec) {
    const inlineVid = activeSec.querySelector('.sec-inline-video');
    if (inlineVid) {
      inlineVid.muted = isGlobalMuted;
      inlineVid.play().catch(() => {});
    }
  }

  if (previousFocusedEl && typeof previousFocusedEl.focus === 'function') {
    previousFocusedEl.focus();
  }
}

vx.addEventListener('click', closeVideoModal);
dialog.addEventListener('click', (e) => {
  if (e.target === dialog) closeVideoModal();
});

/**
 * ==============================================================================
 * REAL-TIME CANVAS GENERATIVE MOIRÉ SPHERES (Thin Black Lines on Light Canvas)
 * ==============================================================================
 */
const bgCanvas = document.getElementById('canvas');
const bgCtx = bgCanvas.getContext('2d');

function sizeBgCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', sizeBgCanvas);
sizeBgCanvas();

let bgFrame = 0;
function drawMoiré() {
  bgFrame++;
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  const cx = spiralOriginX;
  const cy = spiralOriginY;
  const radius = Math.min(winW, winH) * 0.42;

  bgCtx.save();
  bgCtx.translate(cx, cy);
  bgCtx.rotate((rotation * 0.008) + (bgFrame * 0.0015));
  bgCtx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
  bgCtx.lineWidth = 0.75;

  for (let r = 20; r < radius; r += 26) {
    bgCtx.beginPath();
    bgCtx.arc(0, 0, r, 0, Math.PI * 1.5);
    bgCtx.stroke();
  }
  bgCtx.restore();

  requestAnimationFrame(drawMoiré);
}
drawMoiré();

/**
 * ==============================================================================
 * ACCESSIBLE REDUCED MOTION PREFERENCE HANDLING
 * ==============================================================================
 */
function handleReducedMotion(e) {
  if (e.matches) {
    document.body.classList.add('reduced');
    if (intro) intro.classList.add('dismissed');
  } else {
    document.body.classList.remove('reduced');
  }
}
const motionMediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
motionMediaQuery.addEventListener('change', handleReducedMotion);
handleReducedMotion(motionMediaQuery);

document.addEventListener('click', (e) => {
  if (e.target.closest('.js-skip-motion')) {
    e.preventDefault();
    document.body.classList.toggle('reduced');
  }
});

// Initialize on Load
buildSpiral();
</script>
